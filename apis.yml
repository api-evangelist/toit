aid: toit
name: Toit
description: >-
  Toit builds an open-source, high-level programming language and runtime for
  microcontrollers, targeting the ESP32 family, together with fleet-management tooling
  for deploying, monitoring and hot-reloading software across large fleets of connected
  IoT devices. The Toit language, virtual machine, package registry and the Jaguar
  (`jag`) live-reload developer CLI are open source and free; Toit also offers a
  self-hostable fleet broker and paid engineering support. The company previously
  operated a managed cloud platform exposing a gRPC API (device, pub/sub data, program
  compilation and organization management) before pivoting to the open-source language
  stack; those Protobuf definitions were archived in 2023. Toit is backed by Creandum.
